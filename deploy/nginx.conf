server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    charset_types text/plain text/xml application/xml text/html;

    # Репозиторий смонтирован целиком, поэтому служебное наружу не отдаём:
    # .git тут публичный, но роботы и сканеры долбятся в него постоянно и
    # засоряют лог, из-за которого вся эта отдача и затевалась.
    location ~ /\. {
        deny all;
    }
    location = /README.md {
        return 404;
    }
    location /deploy/ {
        deny all;
    }
    location /docs/ {
        return 301 https://antonbond14.github.io/visarun-nhatrang/;
    }

    # Рекламные ссылки /go/<код> и /test/<код>: клик записывает visaran-click
    # из проекта visaran (та же сеть getmenu_default) и сам ведёт в бота.
    # X-Forwarded-For от Caddy уходит туда как есть — это IP гостя для
    # fingerprint. Имя резолвится при запросе, а не на старте: nginx поднимется
    # и без счётчика, а человек тогда уйдёт в бота с кодом, но без клика.
    location ~ "^/(go|test)/[A-Za-z0-9_-]{1,64}$" {
        # Короткий кэш имени: после деплоя бота у счётчика новый IP. Имя
        # лежащего контейнера DNS Docker ищет снаружи (в Docker Desktop
        # замерено 4 с) — ждём не больше секунды и уходим в запасной переход.
        resolver 127.0.0.11 valid=5s ipv6=off;
        resolver_timeout 1s;
        set $click_upstream http://visaran-click:8787;
        proxy_pass $click_upstream;
        proxy_connect_timeout 1s;
        proxy_next_upstream_tries 1;
        proxy_read_timeout 5s;
        error_page 502 503 504 = @click_down;
    }
    location @click_down {
        rewrite ^/go/(.+)$ https://t.me/visarun_global_bot?start=$1? redirect;
        return 302 https://t.me/visarun_global_bot?start=test;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
